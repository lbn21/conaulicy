# yaml-language-server: $schema=./sources.schema.json
#
# THE configuration of conaulicy.pl's data: sources, their public pages, how
# changes are detected, read and checked, when the import runs, the AI models,
# alert rules, the source archive, and the site's feature links. Everything
# else is derived from this file and CI fails on drift (npm run config:check):
# docs/data/sources.md, web/lib/config.generated.ts (site), the import
# workflow's cron lines. Schema: etl/sources.schema.json. How to change
# things: docs/import.md (RUNBOOK).

site:
  url: https://conaulicy.pl
  # Footer navigation: live features only; shown once there are 2+ links.
  features:
    - section: Sprawdź przy swojej ulicy
      links:
        - { href: /, text: Wywóz śmieci }

schedule:
  # Daily import time. GitHub cron is UTC-only, so the workflow carries one
  # cron per UTC offset of this time zone (summer and winter); the import
  # itself decides what is due. false = no cron lines in the workflow (the
  # drift check enforces it); manual runs still work.
  enabled: false
  time: "05:00"
  timezone: Europe/Warsaw

import:
  # Network calls: attempts, first backoff (doubles each time).
  retries: { attempts: 4, backoffSeconds: 5 }
  alerts:
    # Dead-man switch: one issue while any zone's last date is closer than this.
    coverageMinDays: 21

# Each domain's own settings (web/scripts/import/<domain>/).
domains:
  waste:
    validate:
      # A row's usual weekday is the one holding at least this share of dates.
      weekdayShare: 0.6
      # An off-weekday date is explained by a public holiday on the usual
      # weekday at most this many days away.
      holidayWindowDays: 6
      # Dates per fraction may differ from last year by this factor ± slack,
      # compared only when last year has data in at least minMonths months.
      counts: { factor: 0.5, slack: 2, minMonths: 10 }

vision:
  # Cursor CLI build installed by the workflow (downloads.cursor.com/lab/<cli>).
  cli: 2026.10.19-6bbf2c4
  # Two independent passes, different vendors; never "auto" or a -fast model.
  passes:
    - { vendor: xai, model: grok-4.7-medium }
    - { vendor: anthropic, model: claude-opus-5-5-medium }

archive:
  bucket: conaulicy-sources-aaed02
  region: eu-central-1
  # GitHub Actions role (OIDC), PutObject/GetObject on sources/* only.
  role: arn:aws:iam::498654322749:role/conaulicy-import-gha

sources:
  # Each source: its domain, a detector (finds the published files), an
  # extractor (reads them into events) and validators. Domains are registered
  # in web/scripts/import/domains.ts, their types in each domain's folder; a
  # new domain (e.g. water cuts announced as posts) is a new folder plus an
  # entry here (docs/import.md).
  - id: gmina
    domain: waste
    name: Gmina Lubaczów
    origin: gmina
    gmina: { id: lubaczow-gmina, teryt: "1809042" }
    # The public page the site links to (never the archive).
    page: https://www.gminalubaczow.pl/2026/01/02/harmonogram-odbioru-odpadow-komunalnych-na-rok-2026/
    detect:
      type: wp-post-files
      site: https://www.gminalubaczow.pl
      postSearch: harmonogram odbioru odpadów
      postTitle: '^Harmonogram odbioru odpadów (komunalnych )?na rok (?<year>\d{4})$'
      file: '^(?<sector>[1-5])_(?<year>\d{4})_[^/]+\.pdf$'
    # Pages whose schedule links are hashed every run: a new link nobody
    # picked up is an issue. Also the fallback when the WP API is down.
    watch:
      - url: https://www.gminalubaczow.pl/2026/01/02/harmonogram-odbioru-odpadow-komunalnych-na-rok-2026/
        links: '^https://www\.gminalubaczow\.pl/wp-content/uploads/.+\.pdf$'
      # Search, newest first: a new yearly post shows up here.
      - url: https://www.gminalubaczow.pl/?s=harmonogram+odbioru&orderby=date&order=DESC
        links: '^https://www\.gminalubaczow\.pl/\d{4}/\d{2}/\d{2}/harmonogram-odbioru-odpadow[^/]*/$'
    zone: waste:gmina-s{sector}
    extract: { type: gmina-pdf-text }
    validate: [year, weekday, counts, villages]

  - id: miasto
    domain: waste
    name: Miasto Lubaczów
    origin: miasto
    gmina: { id: lubaczow-miasto, teryt: "1809011" }
    page: https://czystylubaczow.info/odbior-odpadow/harmonogram-odbioru-odpadow/
    detect:
      type: wp-media
      site: https://czystylubaczow.info
      parent: 48
      file: '^harmonogram-(?<year>\d{4})-s(?<sector>[1-5])\.jpg$'
    watch:
      - url: https://czystylubaczow.info/odbior-odpadow/harmonogram-odbioru-odpadow/
        # Uploads, without WordPress's resized copies (-1024x725.jpg).
        links: '^https://czystylubaczow\.info/wp-content/uploads/.+(?<!-\d+x\d+)\.(jpe?g|png|pdf)$'
      - url: https://czystylubaczow.info/?s=harmonogram&orderby=date&order=DESC
        links: '^https://czystylubaczow\.info/[^?#]*harmonogram[^?#]*/$'
    zone: waste:miasto-s{sector}
    # No text layer: the vision passes above; applied only if they agree 100%.
    extract: { type: miasto-jpg-vision }
    validate: [year, weekday, counts, streets]
    aliases:
      Monte Casino: Monte Cassino
      Józefa Conrada-Korzeniowskiego: Józefa Conrad-Korzeniowskiego
      Jagiellonów: Osiedle Jagiellonów

