[project]
name = "conaulicy-etl"
version = "0.1.0"
description = "Provisional 2026 Lubaczów waste-schedule extraction"
requires-python = ">=3.15"
dependencies = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
