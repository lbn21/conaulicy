# The unattended import (docs/import.md), every domain: GitHub-hosted
# runner, no approvals, no people. A change that passes every check is
# applied; anything else becomes an issue, closed by the next clean run,
# or a review PR for a file a person must look at (docs/import.md).
# Configured in etl/sources.yaml. Started by workflow_dispatch only: no GitHub
# schedule (it never fired in this repo); daily runs come from Vercel Cron
# (/api/cron/import, daily 04:17 UTC) dispatching mode=apply.
name: import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "extract-only: no database (tests the vision passes); dry-run: report, write only the import_runs row; apply: the real import"
        type: choice
        options: [extract-only, dry-run, apply]
        default: extract-only
      force_extract:
        description: "Extract known files too (proves the extraction reproduces the database)"
        type: boolean
        default: false

permissions:
  # Review PRs: the import pushes only its own import-review/* branches,
  # never main.
  contents: write
  id-token: write # AWS through OIDC, no AWS keys
  issues: write
  pull-requests: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Config
        id: config
        run: |
          echo "cli=$(yq '.vision.cli' etl/sources.yaml)" >> "$GITHUB_OUTPUT"
          echo "role=$(yq '.archive.role' etl/sources.yaml)" >> "$GITHUB_OUTPUT"
          echo "region=$(yq '.archive.region' etl/sources.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          # Cursor CLI, the build pinned in etl/sources.yaml (vision.cli).
          mkdir -p "$HOME/cursor-agent"
          curl -fsSL --retry 4 "https://downloads.cursor.com/lab/$CLI/linux/x64/agent-cli-package.tar.gz" \
            | tar --strip-components=1 -xzf - -C "$HOME/cursor-agent"
          # The package's binary is cursor-agent; the CLI is called agent.
          ln -sf "$HOME/cursor-agent/cursor-agent" "$HOME/cursor-agent/agent"
          "$HOME/cursor-agent/agent" --version
          echo "$HOME/cursor-agent" >> "$GITHUB_PATH"
        env:
          CLI: ${{ steps.config.outputs.cli }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: inputs.mode == 'apply'
        with:
          role-to-assume: ${{ steps.config.outputs.role }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Import
        id: import
        working-directory: web
        run: |
          case "$MODE" in
            extract-only) flags="--extract-only" ;;
            dry-run) flags="--dry-run" ;;
            apply) flags="" ;;
          esac
          [ "$FORCE" = "true" ] && flags="$flags --force-extract"
          node scripts/import/core/run.ts $flags
        env:
          MODE: ${{ inputs.mode }}
          FORCE: ${{ inputs.force_extract }}
          IMPORT_DATABASE_URL: ${{ inputs.mode != 'extract-only' && secrets.IMPORT_DATABASE_URL || '' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          GH_TOKEN: ${{ github.token }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # TERYT (GUS ULIC/SIMC) is the source of place and street names: any
      # difference from our places becomes one review issue, never a change
      # to them (scripts/check-teryt.ts). Read-only on the database; runs
      # even when the import failed.
      - name: TERYT check
        if: ${{ !cancelled() && inputs.mode == 'apply' }}
        working-directory: web
        run: node scripts/check-teryt.ts --issue
        env:
          IMPORT_DATABASE_URL: ${{ secrets.IMPORT_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # lib/zuk-places.generated.ts (what the ZUK prompt and gate read, in
      # production and CI) must still be what the archived TERYT files
      # give: this job alone can read the archive, PR CI cannot.
      - name: ZUK places snapshot
        if: ${{ !cancelled() && inputs.mode == 'apply' }}
        working-directory: web
        run: npm run sources:pull -- --origin teryt && npm run zuk:places -- --check

      # Anything that broke outside the import's own reporting (install, AWS,
      # database connection): one open issue (key "workflow"), commented on
      # repeat failures, closed by the next clean run.
      - name: Open an issue
        if: failure() && steps.import.outputs.issued != 'true' && inputs.mode == 'apply'
        run: |
          number=$(gh issue list --repo "$REPO" --state open --search "[import] in:title" --limit 200 --json number,body \
            -q '.[] | select(.body | contains("<!-- import-key: workflow -->")) | .number' | head -1)
          body="The import failed before it could report: $RUN"
          if [ -n "$number" ]; then gh issue comment "$number" --repo "$REPO" --body "$body"
          else gh issue create --repo "$REPO" --title "[import] Workflow import failed" \
            --body "$body"$'\n\n'"<!-- import-key: workflow -->"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
