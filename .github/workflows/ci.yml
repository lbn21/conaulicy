name: CI

on:
  pull_request:
    # No CI for a PR that changes only prose or review data; the last
    # matching pattern wins. Still checked: docs/data/sources.md (generated,
    # config:check), etl/review/approvals.yaml (read by the import checks), and
    # every other file (a data file anywhere fails check-tracked-data).
    paths:
      - "**"
      - "!**.md"
      - "docs/data/sources.md"
      - "!etl/review/**"
      - "etl/review/approvals.yaml"
  # Lighthouse (job perf) only, on demand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    # A throwaway Postgres with the CI fixture (scripts/ci-fixture.ts), so the
    # build and the checks have every kind of place, without any secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conaulicy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d conaulicy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/conaulicy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before npm ci: with Java on PATH, vnu-jar's postinstall does not
      # download its own runtime.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Biome
        run: npx biome ci

      - name: Unit tests
        run: npm test

      - name: No data files in git (sources live in S3)
        run: node scripts/check-tracked-data.mjs

      - name: "Config (etl/sources.yaml: schema, nothing derived drifted)"
        run: npm run config:check

      - name: Own CSS (GOV.UK classes only, site.scss capped)
        run: node scripts/check-own-css.mjs

      - name: "Contrast (WCAG pairs, every colour token checked)"
        run: node ../design/contrast.mjs

      - name: Database (migrate + seed)
        run: npm run db:migrate && npm run db:ci-fixture

      - name: Build
        run: npm run build

      - name: GOV.UK brand assets (none shipped)
        run: node scripts/check-govuk-assets.mjs

      - name: First-load JS budget
        run: npm run budget

      - name: HTML (Nu Html Checker)
        run: node scripts/check-html.mjs

      # Chromium, cached by Playwright version. No --with-deps: the runner
      # already has the libraries it needs, and apt (slow mirrors) only added
      # unused CJK/X fonts and xvfb.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for axe
        run: npx playwright install chromium

      - name: Accessibility (axe, WCAG 2.2 AA)
        run: node scripts/check-a11y.mjs

      - name: Search popup (no layout shift, combobox keys)
        run: node scripts/check-search.mjs

      - name: Home examples (each has upcoming pickups)
        run: node scripts/check-examples.mjs

      - name: "All places (/ulice: every place once, Polish order, no JS of its own)"
        run: node scripts/check-all-places.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/ulice-screenshots

      # For the reviewer: /ulice at 390 px and 1280 px, from this build.
      - name: Screenshots of /ulice
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ulice-screenshots
          path: ${{ runner.temp }}/ulice-screenshots
          if-no-files-found: ignore
          retention-days: 14

      # pdfinfo, pdffonts and pdftotext read the generated PDFs. Not on the
      # runner, so its .debs are cached: apt (slow mirrors) only on a miss,
      # and a hit installs them offline.
      - name: Runner image
        id: image
        run: echo "key=$ImageOS-$ImageVersion-$(dpkg --print-architecture)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: poppler-cache
        with:
          path: ~/.cache/poppler-debs
          key: poppler-debs-${{ steps.image.outputs.key }}

      - name: Install poppler-utils
        env:
          CACHE_HIT: ${{ steps.poppler-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != true ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --download-only poppler-utils
            mkdir -p ~/.cache/poppler-debs
            cp /var/cache/apt/archives/*.deb ~/.cache/poppler-debs/
          fi
          sudo dpkg -i ~/.cache/poppler-debs/*.deb

      - name: "Street PDFs (tagged, pages, size, Atkinson only, text version)"
        run: node scripts/check-pdf.mjs

      - name: "Fonts (no layout shift when they arrive late)"
        run: node scripts/check-fonts.mjs

      - name: "Page metadata (own title, description and share link)"
        run: node scripts/check-metadata.mjs

      - name: "Indexing (CI build: noindex, robots.txt closed)"
        run: node scripts/check-indexing.mjs --expect=noindex

      - name: "Query parameters (unknown ones redirect to the clean URL)"
        run: node scripts/check-query.mjs

      # A second, production-like build (lib/indexing.ts). The normal build is
      # set aside and put back, because the importer checks below serve pages
      # from it. Moved, not copied: .next/cache holds the pages the checks
      # above rendered, which this build would serve. Before the importer
      # checks: they empty the database.
      - name: "Indexing (production-like build: indexable, vercel.app redirect)"
        run: |
          mv .next .next-ci
          export VERCEL_ENV=production
          npm run build
          # Also for next start: pages rendered on demand read it at runtime,
          # as on Vercel.
          node scripts/check-indexing.mjs --expect=index
          rm -rf .next
          mv .next-ci .next

      # Last: it empties the database and imports a made-up dataset. Its schedules come
      # from a local server, so the source check needs no internet.
      - name: "Importer (synthetic dataset: dry run, apply, guards)"
        run: node scripts/check-import.mjs

      - name: "Unattended import (made-up waste sources: apply, revert, issues, fallback, dead-man switch)"
        run: node scripts/check-import-run.mjs

  # Lighthouse, on demand only (docs/perf.md): its own database with the CI
  # fixture and its own build.
  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conaulicy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d conaulicy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/conaulicy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in the web job: npm ci runs vnu-jar's postinstall.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Database (migrate + seed)
        run: npm run db:migrate && npm run db:ci-fixture

      - name: Build
        run: npm run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install chromium

      # Lighthouse mobile with real throttling (Slow 4G, 4× CPU), median of
      # 5 runs per page against the budgets in docs/perf.md; plus HTML size,
      # preloaded fonts and search keystroke time.
      - name: "Performance (Lighthouse budgets)"
        run: node scripts/check-perf.mjs
