name: CI

on:
  # No paths filter: `web` is a required check, so it must report on every PR.
  pull_request:
  # Fills the main cache that every PR can read (PR caches stay in their PR).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    # A throwaway Postgres with the CI fixture (scripts/ci-fixture.ts), so the
    # build and the checks have every kind of place, without any secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conaulicy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d conaulicy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/conaulicy
      # The built site never asks IMGW: the banner reads the fixtures
      # (web/lib/imgw-mock.ts, docs/data/imgw.md).
      IMGW_WARNINGS_URL: mock:none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before npm ci: with Java on PATH, vnu-jar's postinstall does not
      # download its own runtime.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Biome
        run: npx biome ci

      # pdfinfo, pdffonts and pdftotext read the generated PDFs; pdftoppm
      # renders a gmina PDF for the import (its unit test and e2e). Not on the
      # runner, so its .debs are cached: apt (slow mirrors) only on a miss,
      # and a hit installs them offline.
      - name: Runner image
        id: image
        run: echo "key=$ImageOS-$ImageVersion-$(dpkg --print-architecture)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: poppler-cache
        with:
          path: ~/.cache/poppler-debs
          key: poppler-debs-${{ steps.image.outputs.key }}

      - name: Install poppler-utils
        env:
          CACHE_HIT: ${{ steps.poppler-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != true ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --download-only poppler-utils
            mkdir -p ~/.cache/poppler-debs
            cp /var/cache/apt/archives/*.deb ~/.cache/poppler-debs/
          fi
          sudo dpkg -i ~/.cache/poppler-debs/*.deb

      - name: Unit tests
        run: npm test

      - name: No data files in git (sources live in S3)
        run: node scripts/check-tracked-data.mjs

      - name: "Config (etl/sources.yaml: schema, nothing derived drifted)"
        run: npm run config:check

      # The palette's generated files (scripts/brand-assets.ts, not in git):
      # restored from this cache when the palette and its generator are
      # unchanged, drawn (and cached) only when they changed. The script hashes
      # the same files and the Next.js version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache/brand-assets
          key: brand-assets-${{ hashFiles('web/lib/palette.ts', 'web/lib/logo.ts', 'web/lib/theme.ts', 'web/lib/govuk-colours.ts', 'web/lib/waste-colours.ts', 'web/lib/brand/*.svg', 'web/scripts/brand-assets.ts', 'web/package-lock.json') }}

      - name: "Brand assets (from lib/palette.ts: skipped, restored or drawn)"
        run: node scripts/brand-assets.ts

      - name: "Unused code (knip: files, exports, dependencies)"
        run: npm run check:unused

      - name: "Duplicate code (jscpd: no clone of 50+ tokens)"
        run: npm run check:dupes

      - name: "Palette (one source: no brand colour outside lib/palette.ts)"
        run: node scripts/check-palette.mjs

      - name: Own CSS (GOV.UK classes only, site.scss capped)
        run: node scripts/check-own-css.mjs

      - name: "Contrast (WCAG pairs, every colour token checked)"
        run: node ../design/contrast.mjs

      - name: Database (migrate + seed)
        run: npm run db:migrate && npm run db:ci-fixture && npm run db:districts -- --apply && npm run db:districts -- --expect-no-changes

      - name: Build
        run: npm run build

      - name: GOV.UK brand assets (none shipped)
        run: node scripts/check-govuk-assets.mjs

      - name: First-load JS budget
        run: npm run budget

      # Chromium, cached by Playwright version. No --with-deps: the runner
      # already has the libraries it needs, and apt (slow mirrors) only added
      # unused CJK/X fonts and xvfb.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for axe
        run: npx playwright install chromium

      - name: Accessibility (axe, WCAG 2.2 AA)
        run: node scripts/check-a11y.mjs

      - name: HTML (Nu Html Checker)
        run: node scripts/check-html.mjs
        env:
          HTML_DIR: ${{ runner.temp }}/html-pages

      # For the reviewer: every checked page's HTML, as served by this build.
      - name: HTML of the checked pages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-pages
          path: ${{ runner.temp }}/html-pages
          if-no-files-found: ignore
          retention-days: 14

      - name: Home examples (each has upcoming pickups)
        run: node scripts/check-examples.mjs

      - name: "All places (/ulice: every place once, Polish order, no JS of its own but PlaceLink)"
        run: node scripts/check-all-places.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/ulice-screenshots

      # For the reviewer: /ulice at 390 px and 1280 px, from this build.
      - name: Screenshots of /ulice
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ulice-screenshots
          path: ${{ runner.temp }}/ulice-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: "Street PDFs (tagged, pages, size, Atkinson only, text version)"
        run: node scripts/check-pdf.mjs

      - name: "Page metadata (own title, description and share link)"
        run: node scripts/check-metadata.mjs

      - name: "Indexing (CI build: noindex, robots.txt closed)"
        run: node scripts/check-indexing.mjs --expect=noindex

      - name: "Query parameters (unknown ones redirect to the clean URL)"
        run: node scripts/check-query.mjs

      # Every banner state from the mock, each page re-rendered by a server
      # with that state's setting; at the end the pages are dropped again, so
      # the checks below render them with mock:none.
      - name: "IMGW banner (every state: markup, axe, focus, zoom, contrast)"
        run: node scripts/check-warnings.mjs
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/imgw-banner-screenshots

      # For the reviewer: every banner state at 375 px and 1280 px, and a
      # contact sheet per width.
      - name: Screenshots of the IMGW banner
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imgw-banner-screenshots
          path: ${{ runner.temp }}/imgw-banner-screenshots
          if-no-files-found: ignore
          retention-days: 14

      # A second, production-like build (lib/indexing.ts). The normal build is
      # set aside and put back, because the importer checks below serve pages
      # from it. Moved, not copied: .next/cache holds the pages the checks
      # above rendered, which this build would serve. Before the importer
      # checks: they empty the database.
      - name: "Indexing (production-like build: indexable, vercel.app redirect)"
        run: |
          mv .next .next-ci
          export VERCEL_ENV=production
          npm run build
          # Also for next start: pages rendered on demand read it at runtime,
          # as on Vercel.
          node scripts/check-indexing.mjs --expect=index
          rm -rf .next
          mv .next-ci .next

      # Last: it empties the database and imports a made-up dataset. Its schedules come
      # from a local server, so the source check needs no internet.
      - name: "Importer (synthetic dataset: dry run, apply, guards)"
        run: node scripts/check-import.mjs

      - name: "Unattended import (made-up waste sources: apply, revert, issues, fallback, dead-man switch)"
        run: node scripts/check-import-run.mjs
