name: CI

on:
  pull_request:
    # No CI for a PR that changes only prose or review data; the last
    # matching pattern wins. Still checked: docs/data/sources.md (generated,
    # config:check), etl/review/approvals.yaml (read by the import checks), and
    # every other file (a data file anywhere fails check-tracked-data).
    paths:
      - "**"
      - "!**.md"
      - "docs/data/sources.md"
      - "!etl/review/**"
      - "etl/review/approvals.yaml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether Lighthouse has anything to measure: the app (web/), this workflow,
  # or etl/sources.yaml (web/lib/config.generated.ts is generated from it).
  # Plain git: a pull_request checks out the merge commit, whose first parent
  # is the base; a push compares with the commit before it. Unsure: run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      perf: ${{ steps.diff.outputs.perf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Changed files
        id: diff
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          base=${BEFORE:-HEAD^1}
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "$files"
            if echo "$files" | grep -qE '^(web/|package(-lock)?\.json$|\.github/workflows/ci\.yml$|etl/sources\.yaml$)'; then
              perf=true
            else
              perf=false
            fi
          else
            echo "No diff against $base: running perf."
            perf=true
          fi
          echo "perf=$perf" | tee -a "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    # A throwaway Postgres with the CI fixture (scripts/ci-fixture.ts), so the
    # build and the checks have every kind of place, without any secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conaulicy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d conaulicy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/conaulicy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before npm ci: with Java on PATH, vnu-jar's postinstall does not
      # download its own runtime.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Biome
        run: npx biome ci

      - name: Unit tests
        run: npm test

      - name: No data files in git (sources live in S3)
        run: node scripts/check-tracked-data.mjs

      - name: "Config (etl/sources.yaml: schema, nothing derived drifted)"
        run: npm run config:check

      - name: Own CSS (GOV.UK classes only, site.scss capped)
        run: node scripts/check-own-css.mjs

      - name: Database (migrate + seed)
        run: npm run db:migrate && npm run db:ci-fixture

      - name: Build
        run: npm run build

      - name: GOV.UK brand assets (none shipped)
        run: node scripts/check-govuk-assets.mjs

      - name: First-load JS budget
        run: npm run budget

      - name: HTML (Nu Html Checker)
        run: node scripts/check-html.mjs

      # Chromium, cached by Playwright version; the system packages it needs
      # are installed every run (--with-deps).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for axe
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, WCAG 2.2 AA)
        run: node scripts/check-a11y.mjs

      - name: Search popup (no layout shift, combobox keys)
        run: node scripts/check-search.mjs

      - name: Home examples (each has upcoming pickups)
        run: node scripts/check-examples.mjs

      # pdfinfo, pdffonts and pdftotext read the generated PDFs.
      - name: Install poppler-utils
        run: command -v pdfinfo || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: "Street PDFs (tagged, pages, size, Atkinson only, text version)"
        run: node scripts/check-pdf.mjs

      - name: "Fonts (no layout shift when they arrive late)"
        run: node scripts/check-fonts.mjs

      - name: "Indexing (CI build: noindex, robots.txt closed)"
        run: node scripts/check-indexing.mjs --expect=noindex

      # A second, production-like build (lib/indexing.ts). The normal build is
      # set aside and put back, because the importer checks below serve pages
      # from it. Moved, not copied: .next/cache holds the pages the checks
      # above rendered, which this build would serve. Before the importer
      # checks: they empty the database.
      - name: "Indexing (production-like build: indexable, vercel.app redirect)"
        run: |
          mv .next .next-ci
          VERCEL_ENV=production npm run build
          node scripts/check-indexing.mjs --expect=index
          rm -rf .next
          mv .next-ci .next

      # Last: it empties the database and imports a made-up dataset. Its schedules come
      # from a local server, so the source check needs no internet.
      - name: "Importer (synthetic dataset: dry run, apply, guards)"
        run: node scripts/check-import.mjs

      - name: "Unattended import (made-up waste sources: apply, revert, issues, fallback, dead-man switch)"
        run: node scripts/check-import-run.mjs

  # Lighthouse on its own runner, in parallel with web and only when the app
  # could have changed: its own database with the CI fixture and its own
  # build, so nothing else shares the CPU. (Reusing web's build as an
  # artifact was measured: 4 s up, 1 s down, but waiting for web cost
  # 3.5 min of wall time against ~20 s for this build.)
  perf:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: conaulicy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d conaulicy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/conaulicy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in the web job: npm ci runs vnu-jar's postinstall.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Database (migrate + seed)
        run: npm run db:migrate && npm run db:ci-fixture

      - name: Build
        run: npm run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Lighthouse mobile with real throttling (Slow 4G, 4× CPU), median of
      # 5 runs per page against the budgets in docs/perf.md; plus HTML size,
      # preloaded fonts and search keystroke time. Re-run once if it fails
      # (runner noise); fails only if both attempts fail, and logs both
      # attempts' medians.
      - name: "Performance (Lighthouse budgets)"
        run: node scripts/check-perf-retry.mjs
